# Weekly re-check that what this repository says about things it does not control
# is still true upstream: the call sites cited in catalog.json, the files an
# alternative row's `wire` record was read in (wire.source, since 2026-09-28),
# and the model strings compat.json records for each platform. Reports by opening an issue rather than failing the build: an
# upstream rename is a false positive, and a permanently red repo teaches
# people to ignore the signal.
#
# Since 2026-09-27 the report also says how many days ago a person last read the
# platform pages (compat.json's as_of) and opens the issue past 45; counts the
# rows whose cited file only moved to another model version together, one line
# per version; and flags a platform page naming a version newer than compat.json
# records, the cue for the release rehearsal in docs/method.md ("Kept current").
#
# Since 2026-10-24 a `path-gone` line names, where one exists, a file in the
# same repository that still holds every string the claim matched: the
# proposed new path, for a person to open (verify_claims.py, "path-gone").
#
# Injection review: no `github.event.*` value reaches a `run:` block. The issue
# body is read from a file the script wrote, never interpolated into a shell.
name: claims

on:
  schedule:
    # Tuesdays 06:00 UTC, a day after the link sweep so the two do not collide.
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Re-read every cited call site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify claims
        id: verify
        env:
          # The workflow token's budget, which GitHub documents as 1,000 REST
          # requests an hour per repository, instead of the unauthenticated 60.
          # Files are read at HEAD on the raw host, so the API is asked only
          # about a file missing or changed there. The job summary says what
          # was spent; a rate limit leaves a claim unchecked, not failed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/verify_claims.py > /tmp/report.txt
          code=$?
          tail -3 /tmp/report.txt
          echo "failed=$code" >> "$GITHUB_OUTPUT"

      - name: Verify the platform matrix
        id: compat
        # verify_compat.py also writes `stale` and `age` to this step's
        # outputs: how many days since a person read every platform page
        # (compat.json's as_of). The age lives here and in the issue, never
        # in a committed file, where it would be wrong the next day.
        run: |
          set +e
          python3 scripts/verify_compat.py | tee /tmp/compat.txt
          echo "failed=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update an issue when something stops holding
        if: steps.verify.outputs.failed != '0' || steps.compat.outputs.failed != '0' || steps.compat.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAIMS_FAILED: ${{ steps.verify.outputs.failed }}
          COMPAT_FAILED: ${{ steps.compat.outputs.failed }}
          COMPAT_STALE: ${{ steps.compat.outputs.stale }}
          COMPAT_AGE: ${{ steps.compat.outputs.age }}
        run: |
          {
            echo "A scheduled re-read found something that needs a person: a statement"
            echo "here that no longer holds upstream, or a reading of the platform pages"
            echo "that is due."
            if [ "$CLAIMS_FAILED" != "0" ]; then
              echo
              echo "### Cited call sites"
              echo
              echo '- `path-gone` — the file moved or was renamed. Where its line names a'
              echo '  file that holds every matched string, that is the proposed path: open'
              echo '  it, then update `evidence.path` (move `read_on` only if you read the'
              echo '  call there). Without one, the file may be gone with its integration.'
              echo '- `claim-gone` — the strings are gone. The integration may have been'
              echo '  removed, in which case `question_types` on that row is now wrong.'
              echo '- `version-moved` — only a pinned model version is gone, and the file'
              echo '  names another: counted per version below, not listed row by row.'
              echo '  `python3 scripts/verify_claims.py --propose-version-rewrite` prints'
              echo '  each row'"'"'s `evidence.matched` rewritten; apply it and leave `read_on`.'
              echo '- a line reading `wire.source` — a file an `alternative` row'"'"'s `wire`'
              echo '  record was read in moved or lost its strings. Re-read it and correct'
              echo '  `wire` (docs/compatibility.md §7 shows it).'
              echo
              echo '```'
              # Rows that only moved their pin are summed up in the
              # `version-moved: N row(s) now pin X` lines instead.
              grep -vE '^\s+(ok|VERSION-MOVED)\s' /tmp/report.txt
              echo '```'
            fi
            if [ "$COMPAT_FAILED" != "0" ]; then
              echo
              echo "### Platform model strings"
              echo
              echo 'A string compat.json records is no longer on its platform page, or a'
              echo 'page names a newer model version (`newer-version`). Update compat.json,'
              echo 'then run `build_compat.py` and `lint_docs.py`: every doc still quoting'
              echo 'the old string will show up as an error. For a new version, first'
              echo 'rehearse: `python3 scripts/lint_docs.py --simulate-model <version>`.'
              echo
              echo '```'
              cat /tmp/compat.txt
              echo '```'
            fi
            if [ "$COMPAT_STALE" = "true" ]; then
              echo
              echo "### compat.json not read lately"
              echo
              echo "A person last read every platform page ${COMPAT_AGE:-an unknown number of} day(s)"
              echo 'ago (compat.json `as_of`). Read each page, correct compat.json, and set'
              echo '`as_of` to that day; the weekly string match does not count as a reading.'
            fi
          } > /tmp/body.md

          gh label create claims --color d29922 \
            --description "A cited call site no longer substantiates its claim" 2>/dev/null || true

          existing=$(gh issue list --state open --label claims --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/body.md
          else
            gh issue create --title "Stale claims found by the weekly re-read" \
              --label claims --body-file /tmp/body.md \
              || gh issue create --title "Stale claims found by the weekly re-read" \
                   --body-file /tmp/body.md
          fi

# Files next week's launches early every Friday, once the week's submissions
# have closed on Thursday 23:59 UTC (scripts/launch_intake.py --collect next;
# L26 of the launch board's second round, docs/launches.md). Each open launch
# issue is checked again against today's catalogue with the facts its check
# comment recorded (GitHub, with this token, for any it did not record), and
# written into launches/<week>.json; a maker the check confirmed gets their
# login, and their line when the row has none, on the product's row. Until
# 2026-11-04 the daily task collected into its pull request and the week
# waited for the owner's Friday merge; since 2026-11-05 nothing is held for a
# person either: every case the check used to hold has a rule.
#
# Like launch-week.yml and metadata.yml, it regenerates what the row changes
# feed, commits, runs the checks on that commit, and pushes to main, rebasing
# onto anything pushed meanwhile. It never forces. If the commit no longer
# applies, it files the week again from the new tip of main, which is safe
# because filing only writes files, up to three times; then it fails, and
# retry.yml runs it once more. Then it asks pages.yml to rebuild the board,
# which lists next week's launches.
#
# Injection review: no `github.event.*` value reaches a `run:` block, and the
# workflow takes no inputs. Issue text reaches only the script, which reads it
# as data and writes it into JSON the checks validate.
name: launch-collect

on:
  schedule:
    # Fridays 00:20 UTC: a launch submitted by Thursday 23:59 UTC is for next week.
    - cron: "20 0 * * 5"
    # The same at 06:20 and 12:20, and on Saturday and Sunday at 06:20:
    # `--collect next` is the coming Monday's week on each of those days, and
    # filing the same issues again changes nothing (a launch on the file stays
    # as it is). So these matter only when the runs before them failed twice
    # (retry.yml) and the daily task has fixed the cause since, or a launch
    # was edited to pass in the meantime. GitHub starts scheduled runs late
    # when it is busy, here 4.5 to 10 hours late in October and November 2026,
    # so the Friday runs can all come and go before the daily task's next
    # run (00:33 UTC); the weekend ones pick up a fix it makes on Saturday.
    - cron: "20 6 * * 5"
    - cron: "20 12 * * 5"
    - cron: "20 6 * * 6"
    - cron: "20 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  actions: write

# The same group as launch-week.yml: both write launches/ and push to main.
concurrency:
  group: launch-week
  cancel-in-progress: false

jobs:
  collect:
    name: File next week's launches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The checks below are lint's, and lint runs its node tests on this one.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Collect the launch issues for next week
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/launch_intake.py --collect next | tee /tmp/collect.log

      - name: Commit what changed
        id: commit
        run: |
          # The same generators as lint.yml and metadata.yml, so a row change
          # leaves nothing generated stale.
          python3 scripts/regenerate.py > /dev/null
          git add -A launches catalog.json README.md README.zh-CN.md docs llms.txt examples/index.json examples/README.md skills/awesome-jev/SKILL.md
          if git diff --cached --quiet; then
            echo "nothing changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "launches: file next week's launches" -m "$(tail -n 1 /tmp/collect.log)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run the checks on that commit before pushing it
        id: checks
        if: steps.commit.outputs.changed == 'true'
        run: python3 scripts/check.py --ci --quick

      - name: Push to main, filing again from the new main if it moved
        id: land
        if: steps.checks.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "landed=main" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "main moved and the commit no longer applies (attempt $attempt): filing again from the new main"
            sleep $((attempt * 15))
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/launch_intake.py --collect next | tee /tmp/collect.log
            python3 scripts/regenerate.py > /dev/null
            git add -A launches catalog.json README.md README.zh-CN.md docs llms.txt examples/index.json examples/README.md skills/awesome-jev/SKILL.md
            if git diff --cached --quiet; then
              echo "main already has the week as filed"
              echo "landed=main" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -q -m "launches: file next week's launches" -m "$(tail -n 1 /tmp/collect.log)"
            python3 scripts/check.py --ci --quick
          done
          echo "::error title=Next week's launches are not on main::main kept moving during three attempts. retry.yml runs this once more, from the tip of main."
          exit 1

      - name: Rebuild the site with the board
        if: steps.land.outputs.landed == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main

      - name: Say what was filed
        if: always()
        run: |
          {
            echo "### Launch collection"
            echo
            sed 's/^/    /' /tmp/collect.log 2>/dev/null || echo "    (no log)"
          } >> "$GITHUB_STEP_SUMMARY"

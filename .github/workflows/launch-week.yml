# Closes last week's launch board and opens this week's, early every Monday
# (scripts/launch_week.py; L12 and L13 of the 2026-11-03 launch-board plan,
# docs/launches.md). Closing reads each launch's thumbs-up votes, weighs them
# (since rules v2, votes that look like a ring of new accounts count for
# nothing, and nobody is asked), ranks the launches and writes the counts
# (never who voted) into launches/<week>.json. Opening creates each launch's
# vote post in the `Launches` Discussion category and writes its number.
#
# It does nothing, and succeeds, when there is no week to close or open, so
# the watchdog sees it run every week before the first launch. With launches
# on file and Discussions still off, opening fails and says why.
#
# Like metadata.yml, it commits what it wrote and pushes it to main, rebasing
# onto anything pushed meanwhile. It never forces. If the commit no longer
# applies, it runs the week again from the new tip of main, which is safe
# because a vote post is found by its marker before one is made and a closed
# week counts again the same way, up to three times; then it fails, and
# retry.yml runs it once more. It runs the checks on its commit before
# pushing, and then asks pages.yml to rebuild the board.
# Once the files are on main it tells each launch's issue (L27): the vote
# post's link when its week opens, and the issue is closed; the result when
# the week closes. Each issue hears each thing once; a comment GitHub refuses
# is reported in the job summary and fails nothing.
#
# Injection review: no `github.event.*` value reaches a `run:` block, and the
# workflow takes no inputs.
name: launch-week

on:
  schedule:
    # Mondays 00:05 UTC: a week runs Monday 00:00 to Sunday 23:59 UTC.
    - cron: "5 0 * * 1"
    # The same at 06:05 and 12:05. A run with nothing left to do does nothing,
    # so these matter only when the first run failed twice (retry.yml) and the
    # daily task has fixed the cause since: the week then opens the same day,
    # with nobody to run it by hand.
    - cron: "5 6 * * 1"
    - cron: "5 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write
  issues: write
  actions: write

concurrency:
  group: launch-week
  cancel-in-progress: false

jobs:
  week:
    name: Close last week and open this one
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The checks below are lint's, and lint runs its node tests on this one.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Close and open the weeks that are due
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/launch_week.py --monday

      - name: Commit what changed
        id: commit
        if: always()
        run: |
          git add -A launches
          if git diff --cached --quiet; then
            echo "nothing changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "launches: close last week, open this week"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # always(): a post made before a later one failed is still committed,
      # so the next run finds its number on file. Only a commit that passes
      # the checks is pushed.
      - name: Run the checks on that commit before pushing it
        id: checks
        if: always() && steps.commit.outputs.changed == 'true'
        run: python3 scripts/check.py --ci --quick

      - name: Push to main, running the week again from the new main if it moved
        id: land
        if: always() && steps.checks.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "landed=main" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "main moved and the commit no longer applies (attempt $attempt): running the week again from the new main"
            sleep $((attempt * 15))
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/launch_week.py --monday
            git add -A launches
            if git diff --cached --quiet; then
              echo "main already has the weeks as written"
              echo "landed=main" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -q -m "launches: close last week, open this week"
            python3 scripts/check.py --ci --quick
          done
          echo "::error title=The weeks are not on main::main kept moving during three attempts. retry.yml runs this once more, from the tip of main."
          exit 1

      - name: Rebuild the site with the board
        if: always() && steps.land.outputs.landed == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main

      # Only from files on main: the run's own commit once it landed, or the
      # checkout when the run changed nothing (a rerun, which then tells any
      # issue an earlier run could not).
      - name: Tell each launch's issue what happened
        if: always() && (steps.land.outputs.landed == 'main' || steps.commit.outputs.changed == 'false')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/launch_week.py --tell

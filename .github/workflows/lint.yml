# Injection review: no `github.event.*` value (issue/PR title, body, branch
# name) is interpolated into any `run:` block in this workflow, so there is no
# attacker-controlled string reaching a shell. Permissions are read-only.
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Validate catalog and generated READMEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: JSON is parseable
        run: |
          python3 -c "
          import json
          for path in ('catalog.json', 'retired.json', 'compat.json', 'patterns.json', 'taxonomy.json', 'collections.json', 'schema/entry.schema.json'):
              json.load(open(path))
              print(f'  ok {path}')
          "

      - name: Validate entries against the schema
        run: python3 scripts/lint.py

      - name: Validate curated entry points and their regression checks
        run: |
          python3 scripts/check_collections.py
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest discover -s tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Catalog filtering and sorting regression checks
        run: node --test scripts/test_catalog_core.mjs

      - name: Assembled site data is complete and current
        run: |
          python3 scripts/assemble_site.py
          python3 scripts/check_site_data.py

      - name: Preview images render with the current catalogue
        run: python3 scripts/render_images.py

      # `git status --porcelain`, not `git diff --quiet`: the pattern pages are
      # created and deleted as patterns gain or lose entries, and git diff cannot
      # see an untracked file. The first example of an empty pattern would make
      # the README link to a page nobody committed, with this step still green.
      - name: READMEs and pattern pages are in sync with catalog.json
        run: |
          python3 scripts/build_readme.py
          drift=$(git status --porcelain -- README.md README.zh-CN.md docs/by-pattern)
          if [ -n "$drift" ]; then
            echo "::error::README.md / README.zh-CN.md / docs/by-pattern are out of sync with catalog.json."
            echo "Run 'python3 scripts/build_readme.py' and commit the result, including new or deleted pages."
            echo "$drift"
            exit 1
          fi
          echo "READMEs and pattern pages in sync"

      - name: compatibility.md is in sync with compat.json
        run: python3 scripts/build_compat.py --check

      # status.md, sources.md, llms.txt and the site's meta tags all froze at
      # the first build's 148 entries because nothing regenerated them.
      - name: Generated numbers in the docs are current
        run: python3 scripts/build_docs.py --check

      # And no new hand-written count can creep back in beside them; and every
      # model string or limit stated anywhere agrees with compat.json.
      - name: Docs carry no stale numbers and agree with compat.json
        run: python3 scripts/lint_docs.py

      - name: README figures are in sync with catalog.json
        run: |
          python3 scripts/build_readme_cover.py --check
          python3 scripts/build_assets.py
          if ! git diff --quiet -- docs/assets; then
            echo "::error::docs/assets/*.svg are out of sync with catalog.json."
            echo "Run 'python3 scripts/build_assets.py' and commit the result."
            git --no-pager diff --stat -- docs/assets
            exit 1
          fi
          echo "figures in sync"

      # The description is the only published claim that does not live in git,
      # so nothing here could ever catch it drifting. It sat at "148 verified
      # examples" while the catalogue grew to 805. Checked on the same push
      # that changes the count, because that is when it goes stale.
      - name: Published description still matches the catalogue
        # A PR may intentionally revise the public pitch; its branch should
        # not require changing the live repository description before review.
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_description.py

      - name: Catalog stats
        run: python3 scripts/counts.py

# Publishes site/ to GitHub Pages with catalog.json copied in at build time, so
# the data lives in exactly one place in the repo. The same build writes the
# files agents read from this domain: retired.json, the entry schema, llms.txt
# and one JSON file per decision pattern under api/v1/ (assemble_site.py).
#
# Injection review: no `github.event.*` value is referenced anywhere in this
# workflow, so no attacker-controlled string can reach a `run:` block. The one
# expression used, steps.deployment.outputs.page_url, is emitted by the
# deploy-pages action itself and is consumed by `environment.url`, not a shell.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "catalog.json"
      - "compat.json"
      - "patterns.json"
      - "taxonomy.json"
      - "collections.json"
      - "picker.json"
      - "retired.json"
      - "schema/**"
      - "llms.txt"
      - "scripts/_stats.py"
      - "scripts/_markers.py"
      - "scripts/assemble_site.py"
      - "scripts/build_docs.py"
      - "scripts/check_collections.py"
      - "scripts/check_site_data.py"
      - "scripts/classify.py"
      - "scripts/measurements.py"
      - "scripts/platform_values.py"
      - "scripts/render_images.py"
      - "scripts/sibling_lists.py"
      - "scripts/site_api.py"
      - "scripts/thresholds.py"
      - "src/awesome_jev_mcp/query.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Assemble the site
        # Copies every runtime data file and writes stats.json; the same script
        # a local preview uses, so the two cannot assemble different sites.
        # --deploy also writes the link-preview tags into index.html, from the
        # same stats: git keeps only a placeholder there, so a pull request
        # adding a row no longer has to change the site's HTML.
        run: python3 scripts/assemble_site.py --deploy

      # Refuses to publish without current link-preview tags, as well as with
      # a stale or truncated copy of the data.
      - name: Sanity-check the catalog and curated entry points
        run: python3 scripts/check_site_data.py --deploy

      # The og:image, the durable social card and the README screenshots are
      # rendered here from the data just assembled, and served from Pages. They
      # used to be committed PNGs, and every one of them froze at the first
      # build. If any page fails to finish rendering its data, this step fails
      # and the previous deploy — whose images match its own data — stays live.
      #
      # The site loads no Chinese web font (site/fonts/fonts.css says why) and
      # the runner image has no CJK font, so Noto Sans CJK, which every font
      # stack on the site names, is installed first: without it the Chinese
      # screenshot and the cards' "中文" render as empty boxes, and
      # --require-cjk-font fails the step instead of publishing them.
      - name: Install a CJK font for the screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fc-list :lang=zh family | sort -u

      - name: Render preview images from the live data
        run: |
          google-chrome --version
          python3 scripts/render_images.py --require-cjk-font

      - uses: actions/configure-pages@v6

      # Since v4 this action leaves dotfiles out unless told otherwise, and
      # assemble_site.py writes site/.nojekyll. A deploy from an artifact never
      # runs Jekyll, so the file changes nothing; keeping it keeps the artifact
      # exactly what v3 uploaded (everything but .git and .github).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

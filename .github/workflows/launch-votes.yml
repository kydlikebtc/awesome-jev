# Reads the thumbs-up votes on one GitHub Discussion and writes their count to
# the job summary (scripts/launch_votes.py; L2 of the 2026-11-03 launch-board
# plan, docs/launches.md). Run by hand only, from the Actions page: it is the
# check that the workflow's own token can read a Discussion's reactions and
# each voter's account age before any launch depends on it. The weekly close
# (launch-week.yml, scripts/launch_week.py) reads every launch the same way.
#
# It writes nothing anywhere but the job summary, and the summary carries
# counts, never who voted.
#
# Injection review: the three inputs reach the script only through `env:`.
# The discussion number is checked as digits and the week as an ISO week
# before use; `own` is a comma-separated list the script splits itself.
name: launch-votes

on:
  workflow_dispatch:
    inputs:
      discussion:
        description: The Discussion's number
        required: true
      week:
        description: An ISO week to weigh the votes for, e.g. 2026-W47 (optional)
        required: false
        default: ""
      own:
        description: Comma-separated logins whose votes are the product's own (optional)
        required: false
        default: ""

permissions:
  contents: read
  discussions: read

jobs:
  read:
    name: Read the votes on one Discussion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read and count the votes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCUSSION: ${{ inputs.discussion }}
          WEEK: ${{ inputs.week }}
          OWN: ${{ inputs.own }}
        run: |
          case "$DISCUSSION" in ''|*[!0-9]*) echo "discussion must be a number"; exit 1;; esac
          if [ -n "$WEEK" ]; then
            echo "$WEEK" | grep -Eq '^[0-9]{4}-W[0-9]{2}$' || { echo "week must look like 2026-W47"; exit 1; }
            python3 scripts/launch_votes.py --discussion "$DISCUSSION" --week "$WEEK" --own "$OWN"
          else
            python3 scripts/launch_votes.py --discussion "$DISCUSSION"
          fi

<svg xmlns="http://www.w3.org/2000/svg" width="152" height="20" role="img" aria-label="Listed in awesome-jev">
  <title>Listed in awesome-jev</title>
  <!-- For a catalogued project's own README (CONTRIBUTING.md, "If the project
       is yours"). It says the project is listed, nothing more. Text lengths
       are fixed, so the badge keeps its width in any font. -->
  <clipPath id="round"><rect width="152" height="20" rx="3"/></clipPath>
  <g clip-path="url(#round)">
    <rect width="70" height="20" fill="#0b0d10"/>
    <rect x="70" width="82" height="20" fill="#f5a524"/>
  </g>
  <!-- The site's three-bar mark (favicon.svg): source evidence, context, a decision. -->
  <rect x="6" y="11" width="2.5" height="4" rx=".75" fill="#4ec97a"/>
  <rect x="9.5" y="8" width="2.5" height="7" rx=".75" fill="#a9b3c0"/>
  <rect x="13" y="5" width="2.5" height="10" rx=".75" fill="#f5a524"/>
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-rendering="geometricPrecision">
    <text x="20" y="14" fill="#e6e9ee" textLength="44" lengthAdjust="spacingAndGlyphs">listed in</text>
    <text x="76" y="14" fill="#0b0d10" textLength="70" lengthAdjust="spacingAndGlyphs">awesome-jev</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1133" viewBox="0 0 720 1133" role="img" aria-label="Which primitive? A decision list drawn from TypeSafe's documentation. Each yes ends at, in order: a generative model, not Jev; code, not Jev; one question per thing; one noul per item; score; noul; choice. If every answer is no: not yet one snap judgment.">
<style>.t{font:600 15px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#1f2328}.k{font:10.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#818b98}.q{font:12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}.n{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}.g{fill:#1a7f37}.d{font:11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e}.c{font:600 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#1f2328}.a{font:italic 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e}.l{font:11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#818b98}</style>
<text x="12" y="22" class="t">Which primitive?</text>
<text x="12" y="40" class="k">TypeSafe's own guidance as a decision list: read down, stop at the first yes</text>
<rect x="12" y="58" width="296" height="79" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="12" y="58" width="296" height="2" fill="#0969da"/>
<text x="26" y="80" class="c">1</text>
<text x="46" y="80" class="q">Is the answer text to be written: a</text>
<text x="46" y="96" class="q">reply, a summary, an explanation?</text>
<text x="296" y="79" class="k" text-anchor="end">[1]</text>
<line x1="308" y1="76" x2="346" y2="76" stroke="#59636e"/>
<path d="M346 72l6 4-6 4z" fill="#59636e"/>
<text x="330.0" y="71" class="a" text-anchor="middle">yes</text>
<rect x="352" y="58" width="356" height="79" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="352" y="58" width="356" height="2" fill="#59636e"/>
<text x="366" y="80" class="n">a generative model, not Jev</text>
<text x="696" y="79" class="k" text-anchor="end">[1]</text>
<text x="366" y="95" class="d">Jev is not trained to write text. To extract a value, let</text>
<text x="366" y="110" class="d">code or another model list candidates and ask Jev to</text>
<text x="366" y="125" class="d">pick one.</text>
<line x1="36" y1="137" x2="36" y2="157" stroke="#59636e"/>
<path d="M32 157l4 6 4-6z" fill="#59636e"/>
<text x="44" y="154.0" class="a">no</text>
<rect x="12" y="163" width="296" height="82" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="12" y="163" width="296" height="2" fill="#0969da"/>
<text x="26" y="185" class="c">2</text>
<text x="46" y="185" class="q">Can code work it out exactly: a</text>
<text x="46" y="201" class="q">rule, arithmetic, a date</text>
<text x="46" y="217" class="q">comparison?</text>
<text x="296" y="184" class="k" text-anchor="end">[2]</text>
<line x1="308" y1="181" x2="346" y2="181" stroke="#59636e"/>
<path d="M346 177l6 4-6 4z" fill="#59636e"/>
<text x="330.0" y="176" class="a" text-anchor="middle">yes</text>
<rect x="352" y="163" width="356" height="82" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="352" y="163" width="356" height="2" fill="#59636e"/>
<text x="366" y="185" class="n">code, not Jev</text>
<text x="696" y="184" class="k" text-anchor="end">[2]</text>
<text x="366" y="200" class="d">Keep deterministic work in code, where it is reliable</text>
<text x="366" y="215" class="d">and cheap.</text>
<line x1="36" y1="245" x2="36" y2="265" stroke="#59636e"/>
<path d="M32 265l4 6 4-6z" fill="#59636e"/>
<text x="44" y="262.0" class="a">no</text>
<rect x="12" y="271" width="296" height="79" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="12" y="271" width="296" height="2" fill="#0969da"/>
<text x="26" y="293" class="c">3</text>
<text x="46" y="293" class="q">Does the judgment rest on several</text>
<text x="46" y="309" class="q">independent things?</text>
<text x="296" y="292" class="k" text-anchor="end">[3]</text>
<line x1="308" y1="289" x2="346" y2="289" stroke="#59636e"/>
<path d="M346 285l6 4-6 4z" fill="#59636e"/>
<text x="330.0" y="284" class="a" text-anchor="middle">yes</text>
<rect x="352" y="271" width="356" height="79" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="352" y="271" width="356" height="2" fill="#bc7503"/>
<text x="366" y="293" class="n">one question per thing</text>
<text x="696" y="292" class="k" text-anchor="end">[3]</text>
<text x="366" y="308" class="d">Ask them in one request, weigh the answers in code,</text>
<text x="366" y="323" class="d">and take each question through this list again.</text>
<text x="366" y="338" class="k">pattern: Speculative fan-out</text>
<line x1="36" y1="350" x2="36" y2="370" stroke="#59636e"/>
<path d="M32 370l4 6 4-6z" fill="#59636e"/>
<text x="44" y="367.0" class="a">no</text>
<rect x="12" y="376" width="296" height="94" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="12" y="376" width="296" height="2" fill="#0969da"/>
<text x="26" y="398" class="c">4</text>
<text x="46" y="398" class="q">Is it a checklist: does each</text>
<text x="46" y="414" class="q">condition or option need its own</text>
<text x="46" y="430" class="q">yes or no?</text>
<text x="296" y="397" class="k" text-anchor="end">[4]</text>
<line x1="308" y1="394" x2="346" y2="394" stroke="#59636e"/>
<path d="M346 390l6 4-6 4z" fill="#59636e"/>
<text x="330.0" y="389" class="a" text-anchor="middle">yes</text>
<rect x="352" y="376" width="356" height="94" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="352" y="376" width="356" height="2" fill="#1a7f37"/>
<text x="366" y="398" class="n"><tspan class="g">◐</tspan> one noul per item</text>
<text x="696" y="397" class="k" text-anchor="end">[5]</text>
<text x="366" y="413" class="d">Each noul is absolute and can be low for every item; a</text>
<text x="366" y="428" class="d">choice is relative and picks the best of them.</text>
<text x="366" y="443" class="k">pattern: Context compaction</text>
<text x="366" y="458" class="c">7 read by a person · 16 text signal only</text>
<line x1="36" y1="470" x2="36" y2="490" stroke="#59636e"/>
<path d="M32 490l4 6 4-6z" fill="#59636e"/>
<text x="44" y="487.0" class="a">no</text>
<rect x="12" y="496" width="296" height="94" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="12" y="496" width="296" height="2" fill="#0969da"/>
<text x="26" y="518" class="c">5</text>
<text x="46" y="518" class="q">Does the answer fall on a</text>
<text x="46" y="534" class="q">spectrum whose points you can</text>
<text x="46" y="550" class="q">describe?</text>
<text x="296" y="517" class="k" text-anchor="end">[6]</text>
<line x1="308" y1="514" x2="346" y2="514" stroke="#59636e"/>
<path d="M346 510l6 4-6 4z" fill="#59636e"/>
<text x="330.0" y="509" class="a" text-anchor="middle">yes</text>
<rect x="352" y="496" width="356" height="94" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="352" y="496" width="356" height="2" fill="#1a7f37"/>
<text x="366" y="518" class="n"><tspan class="g">▮</tspan> score</text>
<text x="696" y="517" class="k" text-anchor="end">[7]</text>
<text x="366" y="533" class="d">Keep each question to one dimension, and describe each</text>
<text x="366" y="548" class="d">level as a situation, not a degree.</text>
<text x="366" y="563" class="k">pattern: Content scoring</text>
<text x="366" y="578" class="c">13 read by a person · 45 text signal only</text>
<line x1="36" y1="590" x2="36" y2="610" stroke="#59636e"/>
<path d="M32 610l4 6 4-6z" fill="#59636e"/>
<text x="44" y="607.0" class="a">no</text>
<rect x="12" y="616" width="296" height="94" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="12" y="616" width="296" height="2" fill="#0969da"/>
<text x="26" y="638" class="c">6</text>
<text x="46" y="638" class="q">Is it a clean yes or no, where the</text>
<text x="46" y="654" class="q">probability itself is the useful</text>
<text x="46" y="670" class="q">signal?</text>
<text x="296" y="637" class="k" text-anchor="end">[6]</text>
<line x1="308" y1="634" x2="346" y2="634" stroke="#59636e"/>
<path d="M346 630l6 4-6 4z" fill="#59636e"/>
<text x="330.0" y="629" class="a" text-anchor="middle">yes</text>
<rect x="352" y="616" width="356" height="94" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="352" y="616" width="356" height="2" fill="#1a7f37"/>
<text x="366" y="638" class="n"><tspan class="g">◐</tspan> noul</text>
<text x="696" y="637" class="k" text-anchor="end">[8]</text>
<text x="366" y="653" class="d">Ask one condition per question, phrased so that a high</text>
<text x="366" y="668" class="d">value means yes.</text>
<text x="366" y="683" class="k">pattern: Safety gating</text>
<text x="366" y="698" class="c">12 read by a person · 65 text signal only</text>
<line x1="36" y1="710" x2="36" y2="730" stroke="#59636e"/>
<path d="M32 730l4 6 4-6z" fill="#59636e"/>
<text x="44" y="727.0" class="a">no</text>
<rect x="12" y="736" width="296" height="94" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="12" y="736" width="296" height="2" fill="#0969da"/>
<text x="26" y="758" class="c">7</text>
<text x="46" y="758" class="q">Is the answer one of a known set</text>
<text x="46" y="774" class="q">of options, with no order between</text>
<text x="46" y="790" class="q">them?</text>
<text x="296" y="757" class="k" text-anchor="end">[6]</text>
<line x1="308" y1="754" x2="346" y2="754" stroke="#59636e"/>
<path d="M346 750l6 4-6 4z" fill="#59636e"/>
<text x="330.0" y="749" class="a" text-anchor="middle">yes</text>
<rect x="352" y="736" width="356" height="94" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="352" y="736" width="356" height="2" fill="#1a7f37"/>
<text x="366" y="758" class="n"><tspan class="g">◆</tspan> choice</text>
<text x="696" y="757" class="k" text-anchor="end">[6]</text>
<text x="366" y="773" class="d">Give the full list, with an other or none option if it may</text>
<text x="366" y="788" class="d">not cover every input.</text>
<text x="366" y="803" class="k">pattern: Tool selection</text>
<text x="366" y="818" class="c">25 read by a person · 108 text signal only</text>
<line x1="36" y1="830" x2="36" y2="850" stroke="#59636e"/>
<path d="M32 850l4 6 4-6z" fill="#59636e"/>
<text x="44" y="847.0" class="a">no</text>
<rect x="12" y="856" width="696" height="49" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="12" y="856" width="696" height="2" fill="#59636e"/>
<text x="26" y="878" class="n">not yet one snap judgment</text>
<text x="696" y="877" class="k" text-anchor="end">[9]</text>
<text x="26" y="893" class="d">Break it into narrower questions, or state the exact condition, and start again.</text>
<text x="12" y="931" class="k">Sources, as docs.typesafe.ai names each page and heading</text>
<text x="12" y="946" class="k">[1] docs.typesafe.ai/model-jaggedness/jev-1.13#generation</text>
<text x="12" y="961" class="k">[2] docs.typesafe.ai/concepts/how-to-build-with-system-one#use-code-when-you-can</text>
<text x="12" y="976" class="k">[3] docs.typesafe.ai/primitives#split-a-complex-judgment-into-several-questions</text>
<text x="12" y="991" class="k">[4] docs.typesafe.ai/primitives/noul#good-practice-ask-more-than-one-question-per-call</text>
<text x="12" y="1006" class="k">[5] docs.typesafe.ai/model-jaggedness/jev-1.13#common-sense-structural-invariants</text>
<text x="12" y="1021" class="k">[6] docs.typesafe.ai/primitives#choose-a-question-type</text>
<text x="12" y="1036" class="k">[7] docs.typesafe.ai/primitives/score#writing-good-levels</text>
<text x="12" y="1051" class="k">[8] docs.typesafe.ai/primitives/noul#writing-a-noul-question</text>
<text x="12" y="1066" class="k">[9] docs.typesafe.ai/primitives#ask-for-one-snap-judgment-per-question</text>
<text x="12" y="1089" class="l">Beside a primitive, rows filed under that pattern: those whose question_types a person recorded, and those where only the</text>
<text x="12" y="1104" class="l">cited file's text shows it (primitives_seen). Never added together.</text>
<text x="12" y="1119" class="l">Design guidance with its sources, not a recommendation of any catalogued row.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="670" viewBox="0 0 600 670" role="img" aria-labelledby="title description">
<title id="title">一周发布流程</title>
<desc id="description">一周发布流程：周四 23:59 UTC 前发布，周五登记，周一到周日投票，下周一出结果。现在：2026-W46 · 投票中，2026-11-15（周日）收榜。</desc>
